refactor:
- title: 'Add hooks for controlling ARCHER output in recenter_tc sector adjuster'
  description: |
    Add new archer_config kwarg to the run_archer function in recenter_tc.
    This kwarg will be a dictionary of various settings used by archer including

    * required_vmax_kts - min windspeed threshold for running archer (defaults to 50)
    * include_archer_metadata_in_sector_info - add high level archer results to sector
      info dictionary, which will then be added to the YAML metadata output (defaults to False)
    * output_products_dict - requested ARCHER outputs and which output_formatter
      and filename_formatter should be used.

    To prevent existing test scripts from breaking, we are currently defaulting
    archer_config to the following if it is not passed at the command line or in an
    output_config YAML file

    * required_vmax_kts - 50
    * include_archer_metadata_in_sector_info - False
    * output_products_dict - "archer_image" and "archer_fix" outputs

    We will eventually remove this logic and update all the test scripts and YAML
    procflow output_config files to explicitly pass these options and not to default to
    anything. That switch will likely be part of a larger refactor where we would instead
    pass recenter_config (or something like that) where we'd also have control over
    akima. The recenter_config could very well be a list of recentering actions (akima
    then archer), which would fit in rather well with order-based processing.

    Also - added new archer_image and archer_fix output_formatters.

    Also - added goes-18/19 and himawari-9 to archer mapping attributes.

    Update the amsr2.tc.color37.imagery_clean.sh test script to be the token example
    for using the new sector_adjuster_kwargs.

    Wait - one more bug fix.
  files:
