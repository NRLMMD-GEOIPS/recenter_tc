breaking change:
- title: 'Update output of run_archer to return more information on ARCHER outputs'
  description: |
    Return a dictionary containing information on the product and output_formatter for
    each product created by ARCHER in addition to the output file path. Similar to the
    previous behavior with tracking the output file names, each meta dictionary is appended
    to a list. The final output returned by the recenter_tc call will be the recentered
    area definition and a list of the output meta dictionaries. All procflows will need
    to be updated appropriately to handle this change.
